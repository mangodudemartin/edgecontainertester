name: Build and Push Microservices to ACR

on:
  push:
    branches: ["main"]

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }} # e.g., myregistry.azurecr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: mediamtx
            context: ./mediamtx
            dockerfile: ./mediamtx/Dockerfile
          - name: rulesengine
            context: ./rulesengine
            dockerfile: ./rulesengine/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
