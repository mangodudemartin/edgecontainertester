apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgecontainertester
  namespace: default
  labels:
    app: edgecontainertester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgecontainertester
  template:
    metadata:
      labels:
        app: edgecontainertester
    spec:
      containers:
        - name: edgecontainertester
          # Replace REGISTRY_PLACEHOLDER with your ACR login server before enabling Flux,
          # or let the CI workflow populate this on the first push to main.
          image: csdevedge.azurecr.io/edgecontainertester:1292fcb20df2a4f73b971c8451460f41215ea53e
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
